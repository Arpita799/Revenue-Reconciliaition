spring.application.name=reconciliation

#Database
spring.datasource.url=jdbc:postgresql://localhost:5432/RRDB
spring.datasource.username=postgres
spring.datasource.password=root

# JPA - validate means Hibernate checks schema matches entities, but does NOT create/alter tables
# Flyway owns all DDL changes instead
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
